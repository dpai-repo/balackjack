    <script>
      // Suppress HMR / WebSocket client noise per environment requirements
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('createWebSocketModuleRunnerTransport') || e.message.includes('vite'))) {
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var reason = '' + (e && (e.reason && (e.reason.message || e.reason) || ''));
        if (reason.includes('WebSocket') || reason.includes('vite')) {
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
